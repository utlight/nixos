[theme]
builtin = "Rosé Pine"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "ghostty", "niri" ]

[widget.clock]
format = "{:%A, %d %B, %H:%M}"

[widget.control-center]
enabled = false

[widget.network]
show_label = false

[keybinds]
up = ["up", "ctrl+p"]
down = ["down", "ctrl+n"]

[wallpaper.default]
