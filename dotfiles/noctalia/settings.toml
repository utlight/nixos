config_version = 16

#NOTE:----------------------------------------------------BAR----------------------------------------------------------

[bar.default]
border_width = 0.0
font_weight = 600
background_opacity = 0.7
border = "primary"
font_family = "JetBrainsMono Nerd Font"
scale = 1.1
margin_edge = 8
margin_ends = 16
start = ["launcher", "workspaces"]
end = ["tray", "keyboard_layout", "clipboard", "notifications", "network", "bluetooth", "volume", "battery", "session"]
widget_spacing = 10

#NOTE:--------------------------------------------------WIDGETS--------------------------------------------------------

[widget.clock]
format = "{:%A, %d %B, %H:%M}"

[widget.keyboard_layout]
hide_when_single_layout = true
show_glyph = false

[widget.network]
show_label = false

#NOTE:-----------------------------------------------CONTROL CENTER----------------------------------------------------

[control_center]
hidden_tabs = ["monitor"]

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "lux/ideapad-conservation-mode:conservation-mode"

[calendar]
enabled = true
event_date_format = "%e %B"

[calendar.account.personal_icloud]
provider = "icloud"
type = "caldav"
username = "oleksandralekseiev@icloud.com"

#NOTE:---------------------------------------------------THEME---------------------------------------------------------

[theme]
builtin = "Rosé Pine"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[theme.templates]
builtin_ids = ["ghostty", "niri"]

[wallpaper.default]
path = "~/nixos/dotfiles/noctalia/3vydZuxp-fond-decran-Printemps-49.png"

[notification]
follow_focused_output = true
layer = "overlay"

[shell.screen_corners]
enabled = true

font_family = "JetBrainsMono Nerd Font"

#NOTE:--------------------------------------------------PLUGINS--------------------------------------------------------

[plugins]
enabled = [
    "lux/ideapad-conservation-mode",
    "noctalia/bitwarden",
    "knyrps/nix-search",
    "noctalia/screen_recorder",
]

[plugin_settings."noctalia/screen_recorder"]
video_source = "focused"

#NOTE:---------------------------------------------------SHELL---------------------------------------------------------

[shell]
date_format = "%A, %d %B"
niri_overview_type_to_launch_enabled = true
screen_time_enabled = true

[shell.screenshot]
confirm_region = true
annotate = true
skip_annotate_on_copy_save = true
directory = "/home/utlight/Pictures/Screenshots"

[shell.launcher]
categories = false
layout = "simple"

[shell.panel]
clipboard_placement = "attached"
launcher_placement = "attached"
open_near_click_clipboard = true
open_near_click_control_center = true
open_near_click_session = true

[[shell.session.actions]]
action = "lock"

[[shell.session.actions]]
action = "logout"

[[shell.session.actions]]
action = "reboot"

[[shell.session.actions]]
action = "shutdown"
variant = "destructive"

#NOTE:----------------------------------------------------MISC---------------------------------------------------------

[location]
auto_locate = true

[bluetooth]
connection_notifications = true

[keybinds]
up = ["up", "ctrl+p"]
down = ["down", "ctrl+n"]
validate = ["Return", "KP_Enter", "space", "Ctrl+y"]
