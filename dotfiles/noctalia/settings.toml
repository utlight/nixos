config_version = 14

[bar.default]
background_opacity = 0.69999998435378075
border = "primary"
border_width = 2.0
concave_edge_corners = false
end = [ "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "battery", "session" ]
font_scale = 1.1499999817460775
margin_edge = 8
margin_ends = 16
start = [ "workspaces" ]
widget_spacing = 10

[control_center]
hidden_tabs = [ "monitor" ]

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "lux/ideapad-conservation-mode:conservation-mode"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

